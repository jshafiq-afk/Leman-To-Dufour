<meta name="mobile-web-app-capable" content="yes">

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>
<style>
/* Layout concept: a mountain-railway altimeter. One climbing readout (metres) fed by what you really know,
   flat hairline sections, bottom tabs on the home screens, a full-screen card flow during practice. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --ink:#112019; --muted:#566860; --line:#D3DDD5;
  --accent:#1B7A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEFE4;
  --blue:#2F55B5; --blue-soft:#E3E9F8;
  --amber:#8A5A00; --amber-soft:#FAEECF;
  --red:#B8322A; --red-soft:#F8E0DC;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#15201B; --ink:#E7EFE9; --muted:#8FA398; --line:#26352E;
    --accent:#46C183; --accent-ink:#06210F; --accent-soft:#17372A;
    --blue:#9AB2FF; --blue-soft:#1B2547;
    --amber:#E6B556; --amber-soft:#3A2E12;
    --red:#FF8F82; --red-soft:#3D1D19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#15201B; --ink:#E7EFE9; --muted:#8FA398; --line:#26352E;
  --accent:#46C183; --accent-ink:#06210F; --accent-soft:#17372A;
  --blue:#9AB2FF; --blue-soft:#1B2547;
  --amber:#E6B556; --amber-soft:#3A2E12;
  --red:#FF8F82; --red-soft:#3D1D19; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 112px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.top h1{font-size:14px;font-weight:800;font-stretch:125%;letter-spacing:.09em;text-transform:uppercase}
.pill{font:600 11px/1 var(--f-mono);letter-spacing:.04em;padding:6px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.hero{position:relative;margin-top:8px;padding:18px 16px 10px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.contours{position:absolute;inset:0;width:100%;height:100%;color:var(--line);opacity:.8;pointer-events:none}
.hero>*:not(.contours){position:relative}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.alt{display:flex;align-items:baseline;gap:6px;margin-top:6px;font:600 clamp(54px,18vw,80px)/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.alt small{font:800 22px/1 var(--f-display);font-stretch:115%;letter-spacing:0;color:var(--muted)}
.zone{margin-top:8px;font-size:15px;color:var(--muted)}
.zone b{color:var(--ink);font-weight:700}
.profile{display:block;width:100%;height:auto;margin-top:6px}
.profile .wl{font:500 9px var(--f-mono);fill:var(--muted)}
.profile .wl.on{fill:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.stat{padding:12px 12px 11px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .v{display:flex;align-items:center;gap:8px;font:600 24px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat .l{margin-top:4px;font-size:12px;color:var(--muted)}
.ring{width:26px;height:26px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:14px;padding:17px 18px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);text-align:left}
.cta b{display:block;font:800 19px/1.15 var(--f-display);font-stretch:112%}
.cta span{display:block;margin-top:3px;font-size:14px;opacity:.88}
.cta svg{flex:none}
.cta:disabled{opacity:.5;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.sec{margin-top:22px}
.sec>h2{font-size:12px;font-weight:800;font-stretch:125%;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.row .ic{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700}
.row .t span{display:block;font-size:14px;color:var(--muted)}
.row .n{font:600 13px var(--f-mono);color:var(--muted)}
.note{padding:12px 14px;border-radius:12px;background:var(--blue-soft);font-size:15px}
.note.amber{background:var(--amber-soft);color:var(--amber)}
.note b{font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent)}
/* territories */
.terr{display:grid;grid-template-columns:78px repeat(3,minmax(0,1fr));gap:6px 6px;align-items:center}
.terr .h{font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.terr .rl{font:800 12px/1.1 var(--f-display);font-stretch:112%}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;background:none;border:0;border-radius:12px}
.stamp svg{width:56px;height:56px}
.stamp .bg{fill:none;stroke:var(--line);stroke-width:4}
.stamp .fg{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.stamp .tx{font:600 12px var(--f-mono);fill:var(--ink);text-anchor:middle}
.stamp.won svg{transform:rotate(-7deg)}
.stamp.won .in{fill:var(--accent-soft)}
.stamp .c{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c0{background:var(--line)}.c1{background:var(--red)}.c2{background:var(--amber)}.c3{background:var(--blue)}.c4{background:var(--accent)}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.ladder .m{font:600 13px var(--f-mono);width:62px;text-align:right;font-variant-numeric:tabular-nums}
.ladder .d{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);flex:none}
.ladder li.on .d{background:var(--accent);border-color:var(--accent)}
.ladder li.on{color:var(--ink)}
.ladder li:not(.on){color:var(--muted)}
.ladder li.next .d{border-color:var(--accent)}
.ladder li small{display:block;font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.badge b{display:block;font-size:14px}
.badge span{display:block;font-size:12px;color:var(--muted)}
.badge:not(.got){opacity:.55}
.badge.got{border-color:var(--accent)}
/* cards list */
.field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.clist details{border-top:1px solid var(--line)}
.clist summary{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;cursor:pointer;list-style:none}
.clist summary::-webkit-details-marker{display:none}
.clist .id{flex:none;width:30px;font:600 12px/1.6 var(--f-mono);color:var(--muted)}
.clist .q{flex:1;min-width:0;font-size:15px}
.clist .bx{flex:none;display:flex;gap:2px;margin-top:6px}
.clist .bx i{width:4px;height:12px;border-radius:2px;background:var(--line)}
.clist .bx i.on{background:var(--accent)}
.clist .det{padding:0 2px 14px 40px;font-size:15px}
.clist .det .ans{margin:4px 0 8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-weight:600}
.clist .det ul{margin:0 0 8px;padding-left:18px;color:var(--muted)}
/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set label{flex:1;min-width:0}
.set label b{display:block;font-weight:700}
.set label span{display:block;font-size:13px;color:var(--muted)}
.set select,.set input[type=date]{padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
textarea.field{min-height:92px;font:12px/1.4 var(--f-mono);resize:vertical}
.why{margin:0;padding-left:18px}
.why li{margin:6px 0}
/* session */
.sbar{display:flex;align-items:center;gap:12px;padding-block:6px}
.x{flex:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prog.time i{background:var(--blue);transition:none}
.prog.time.low i{background:var(--red)}
.combo{flex:none;min-width:52px;text-align:right;font:600 13px var(--f-mono);color:var(--muted)}
.combo.hot{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 10px}
.tag{font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tag.new{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.tag.retry{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.str{display:flex;gap:3px;margin-left:auto}
.str i{width:5px;height:14px;border-radius:2px;background:var(--line)}
.str i.on{background:var(--accent)}
.qcard{padding:18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.qcard .qt{font:600 21px/1.28 var(--f-body)}
.qcard .nb{margin-top:10px;font-size:13px;color:var(--muted)}
.opts{margin-top:12px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;margin-top:10px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:17px;line-height:1.3}
.opt .k{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font:600 12px var(--f-mono);color:var(--muted);margin-top:-1px}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.no{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt.pulse{animation:pulse 1.1s ease-in-out infinite}
.opt:disabled{cursor:default}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--accent-soft)}}
.idk{display:block;width:100%;margin-top:12px;padding:12px;background:none;border:0;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.banner{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font:800 20px/1.1 var(--f-display);font-stretch:112%}
.banner.ok{color:var(--accent)}
.banner.no{color:var(--red)}
.banner.sk{color:var(--blue)}
.hook{margin-top:12px;padding:13px 14px;border-radius:12px;background:var(--blue-soft)}
.hook .eyebrow{color:var(--blue);margin-bottom:5px}
.next{margin-top:10px;font-size:14px;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock>div{max-width:560px;margin:0 auto}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.think{text-align:center;padding:26px 8px 8px;color:var(--muted)}
.think b{display:block;margin-bottom:4px;font:800 18px var(--f-display);font-stretch:112%;color:var(--ink)}
/* summary */
.sum{padding:22px 16px 16px;text-align:center;border:1px solid var(--line);border-radius:16px;background:var(--surface);position:relative;overflow:hidden}
.sum>*:not(.contours){position:relative}
.gain{font:600 clamp(56px,19vw,84px)/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--accent)}
.sum .sub{margin-top:6px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line)}
.grid3 div{padding:12px 4px 2px}
.grid3 b{display:block;font:600 22px var(--f-mono)}
.grid3 span{font-size:12px;color:var(--muted)}
.miss{margin-top:8px}
.miss div{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.miss b{display:block;font-weight:600}
.miss span{color:var(--accent);font-weight:600}
.bars{display:grid;gap:8px;margin-top:6px}
.bars div{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bars .bg{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bars .bg i{display:block;height:100%;background:var(--accent)}
.bars em{font:600 12px var(--f-mono);font-style:normal;text-align:right}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:50;max-width:min(92vw,420px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.intro{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.intro h2{font-size:17px;font-stretch:112%;font-weight:800}
.intro ol{margin:8px 0 12px;padding-left:20px}
.intro li{margin:4px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell" id="app"></div>
<div id="tabbar"></div>
<div id="toasts" aria-live="polite" role="status"></div>

<script>
// [id, question, options[4], correctIndex, memoryHook, doubtNote]
// id 1-160 follows the official PDF order. Territory (section x level) is derived from id.
const QUESTIONS = [
[1,"Quel est le plus grand canton suisse (superficie) ?",["Zurich","Grisons","Valais","Vaud"],1,"Grisons (Graubünden) is the giant: about 7,100 km². It is also the only trilingual canton (German, Italian, Romansh), which links to question 8.",""],
[2,"Combien y a-t-il de cantons en Suisse ?",["26","28","25","23"],0,"26 = 20 full cantons + 6 half-cantons. Jura was the 26th, in 1979.",""],
[3,"Quel est le plus grand lac entièrement suisse ?",["Le Lac Léman","Le Lac de Neuchâtel","Le Lac Majeur","Le Lac de Zurich"],1,"The Léman is bigger but shared with France. Neuchâtel is the biggest lake that sits entirely inside Switzerland.",""],
[4,"Quel canton est officiellement bilingue (deux langues officielles) ?",["Genève","Bâle","Vaud","Fribourg"],3,"Fribourg / Freiburg = French + German. (Valais and Berne are bilingual too, but they are not on this list.)",""],
[5,"La prairie du Grütli se trouve au bord du …",["Lac de Bienne","Lac de Constance","Lac de Zurich","Lac des Quatre-Cantons"],3,"Grütli = the oath meadow on Lac des Quatre-Cantons (Lake Lucerne), in the heart of the founding cantons.",""],
[6,"Combien y a-t-il d'habitants en Suisse ?",["Environ 10 millions","Environ 6 millions","Environ 5 millions","Environ 9 millions"],3,"About 9 million people. Vaud has roughly 0.85 million, a bit under a tenth of the country.",""],
[7,"Le Palais fédéral se trouve à …",["Zurich","Fribourg","Berne","Lucerne"],2,"Palais fédéral = Parliament and government = Berne. Berne is the 'ville fédérale'.",""],
[8,"On parle le romanche dans le canton …",["de Saint-Gall","du Valais","d’Uri","des Grisons"],3,"Romansh (romanche) lives in the Grisons. It is the 4th national language and is spoken by under 1% of people.",""],
[9,"Quel pays n'a pas de frontière avec la Suisse ?",["Italie","Belgique","France","Allemagne"],1,"Five neighbours: France, Germany, Italy, Austria, Liechtenstein. Belgium is not one of them.",""],
[10,"Le lac Léman est situé en Suisse et en …",["France","Italie","Autriche","Allemagne"],0,"The Léman's southern shore is French (Évian, Thonon). Swiss shore: Vaud, Geneva, Valais.",""],
[11,"Quelle est la plus grande ville de Suisse ?",["Genève","Berne","Zurich","Bâle"],2,"Zurich is the biggest city (about 440,000). Berne is the capital but much smaller.",""],

    var weak=seen.filter(function(id){return S.c[id][1]>t}).sort(function(a,b){return S.c[a][0]-S.c[b][0]});
    var ids=dueIds.slice(0,10).concat(un.slice(0,6));
    weak.forEach(function(id){if(ids.length<12)ids.push(id)});
    if(!ids.length)ids=shuffle(pool).slice(0,10);
    var rev=shuffle(ids.filter(function(id){return S.c[id]})).map(function(id){return {id:id,ph:'review'}});
    var nn=ids.filter(function(id){return !S.c[id]}).map(function(id){return {id:id,ph:'new'}});
    q=weave(rev,nn);
  }else if(mode==='exam'){
    q=shuffle(Object.keys(CARD).map(Number)).slice(0,40).map(function(id){return {id:id,ph:'exam'}});
  }else if(mode==='sprint'){
    var pool2=Object.keys(S.c).map(Number);
    q=shuffle(pool2).map(function(id){return {id:id,ph:'sprint'}});
  }

}
function startSession(mode,opt){
  var q=build(mode,opt);
  if(mode==='sprint'&&q.length<8){toast('Learn at least 8 cards first, then sprint');return}
  if(!q.length){toast(mode==='mistakes'?'No weak cards right now':'Nothing to practise here yet');return}
  SES={mode:mode,opt:opt||{},queue:q,pool:mode==='sprint'?q.slice():null,done:0,ok:0,bad:0,idk:0,newSeen:0,failed:{},loops:{},combo:0,best:0,xp:0,alt0:altitude(),stage:'ask',cur:null,order:[],locked:true,res:null,exam:[],wrong:[],left:60000,score:0,t0:Date.now(),timer:null,lastState:null};
  if(mode==='sprint'){SES.end=Date.now()+60000;SES.timer=setInterval(tickSprint,120)}
  nextCard();
}
function nextCard(){
  var s=SES;
  if(s.mode==='sprint'){if(Date.now()>=s.end){return endSession()}if(!s.queue.length)s.queue=shuffle(s.pool);}
  if(!s.queue.length)return endSession();
  s.cur=s.queue[0];
  var c=CARD[s.cur.id];
  s.order=shuffle([0,1,2,3]);
  s.res=null;s.locked=true;
  var cs=C(s.cur.id);
  s.stage=(S.set.think&&s.cur.ph==='review'&&cs.b>=2)?'think':'ask';
  render();
}
function tickSprint(){
  var s=SES;if(!s||s.mode!=='sprint'||s.stage==='done'){return}
  var left=s.end-Date.now();
  if(left<=0){clearInterval(s.timer);s.timer=null;if(s.stage==='ask'||s.stage==='fb'){endSession()}return}
  var el=$('#tbar');if(el){el.style.width=Math.max(0,left/600)+'%';el.parentNode.classList.toggle('low',left<10000)}
}
function ins(x,pos){SES.queue.splice(Math.min(pos,SES.queue.length),0,x)}
function answer(i){
  var s=SES;if(!s||(s.stage!=='ask'&&s.stage!=='think'))return;
  var it=s.queue.shift(),card=CARD[it.id],res;
  if(i<0)res='idk';else res=(s.order[i]===card.a)?'good':'bad';
  var before=altitude(),ph=it.ph;
  var cs=grade(it.id,res,ph,s.mode);
  bumpDay(it.id,res,ph);
  s.done++;
  if(res==='good'){s.ok++;s.combo++;if(s.combo>s.best)s.best=s.combo;var m=s.combo>=10?2:(s.combo>=5?1.5:1);s.xp+=Math.round(10*m);S.xp+=Math.round(10*m)}
  else{s.bad++;if(res==='idk')s.idk++;if(res==='bad')s.combo=0;s.wrong.push(it.id)}
  if(ph==='new')s.newSeen++;
  var L=s.loops;
  if(s.mode==='exam'){s.exam.push({id:it.id,res:res});save();return nextCard()}
  if(s.mode==='sprint'){
    if(res==='good'){s.score++;s.end+=0}else{s.end-=3000}
    s.res=res;s.stage='fb';s.locked=true;s.chosen=i;save();render();
    setTimeout(function(){if(SES===s&&s.stage==='fb'){nextCard()}},res==='good'?260:1150);
    return;
  }
  if(ph==='new'){if(res!=='good')s.failed[it.id]=1;ins({id:it.id,ph:'second'},5)}
  else if(ph==='second'){if(res!=='good'){s.failed[it.id]=1;L[it.id]=(L[it.id]||0)+1;ins({id:it.id,ph:'retry',k:1},3)}}
  else if(ph==='review'){if(res!=='good'){s.failed[it.id]=1;ins({id:it.id,ph:'retry',k:1},3)}}
  else if(ph==='retry'){
    if(res==='good'){if(it.k<2)ins({id:it.id,ph:'retry',k:it.k+1},6)}
    else{L[it.id]=(L[it.id]||0)+1;if(L[it.id]<4)ins({id:it.id,ph:'retry',k:1},3)}
  }
  s.res=res;s.chosen=i;s.stage='fb';s.locked=(res==='good');s.lastState=cs;
  var after=altitude();
  s.crossed=WP.filter(function(w){return before<w.a&&after>=w.a});
  save();render();
}
function lockIn(){var s=SES;if(s&&s.stage==='fb'&&!s.locked){s.locked=true;render()}}
function cont(){

  nextCard();
}
function quit(){

}

}

function contours(){

  for(var k=0;k<10;k++){var d='M0 '+(14+k*24);for(var x=0;x<=w;x+=12){d+=' L'+x+' '+(14+k*24+Math.sin(x/58+k*.7)*9+Math.cos(x/31+k)*4).toFixed(1)}p+='<path vector-effect="non-scaling-stroke" d="'+d+'"/>'}
  return '<svg class="contours" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">'+p+'</svg>';
}
function profile(alt){
  var W=340,H=132,px=16,py=14,base=H-38,n=WP.length;
  function X(i){return px+i*(W-2*px)/(n-1)}
  function Y(a){return base-(a-A0)/(A1-A0)*(base-py)}
  var pts=WP.map(function(w,i){return [X(i),Y(w.a)]});
  var sg=0;while(sg<n-2&&alt>=WP[sg+1].a)sg++;
  var t=Math.min(1,Math.max(0,(alt-WP[sg].a)/(WP[sg+1].a-WP[sg].a)));
  var pin=[pts[sg][0]+(pts[sg+1][0]-pts[sg][0])*t,pts[sg][1]+(pts[sg+1][1]-pts[sg][1])*t];
  var dn=pts.slice(0,sg+1).concat([pin]);
  function pl(a){return a.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
  var area=pl(dn)+' '+pin[0].toFixed(1)+','+base+' '+pts[0][0].toFixed(1)+','+base;
  var s='<svg class="profile" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Altitude profile from Lac Léman to the Pointe Dufour, currently at '+Math.round(alt)+' metres">';
  s+='<line x1="'+px+'" x2="'+(W-px)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
  s+='<polyline points="'+pl(pts)+'" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" stroke-linejoin="round"/>';
  s+='<polygon points="'+area+'" fill="var(--accent-soft)"/>';
  s+='<polyline points="'+pl(dn)+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  WP.forEach(function(w,i){
    var on=alt>=w.a;
    s+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="4" fill="'+(on?'var(--accent)':'var(--surface)')+'" stroke="'+(on?'var(--accent)':'var(--muted)')+'" stroke-width="1.6"/>';
    s+='<text class="wl'+(on?' on':'')+'" x="'+pts[i][0].toFixed(1)+'" y="'+(base+13+(i%2)*13)+'" text-anchor="middle">'+w.s+'</text>';
  });
  s+='<circle cx="'+pin[0].toFixed(1)+'" cy="'+pin[1].toFixed(1)+'" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>';
  return s+'</svg>';
}

  h+='<div class="set"><label for="s-goal"><b>Daily goal</b><span>Answers per day. 10 keeps your streak alive.</span></label><select id="s-goal">'+[10,20,30,50].map(function(v){return '<option'+(S.set.goal===v?' selected':'')+'>'+v+'</option>'}).join('')+'</select></div>';
  h+='<div class="set"><label for="s-think"><b>Think first</b><span>For cards you know, answer in your head before seeing the choices. Slower, and it sticks better.</span></label><span class="sw"><input id="s-think" type="checkbox"'+(S.set.think?' checked':'')+'><i></i></span></div></section>';
  h+='<section class="sec"><h2>Why it works</h2><ol class="why"><li><b>Retrieval.</b> Trying to answer, even wrongly, teaches more than rereading.</li><li><b>Spacing.</b> Cards return after 1, 2, 4, 8, 16, 35 and 70 days, just as you are about to forget.</li><li><b>Correction.</b> A miss returns within minutes and again later, and you tap the right answer to lock it in.</li><li><b>Mixing.</b> Reviews shuffle all topics, so you learn to tell similar facts apart.</li></ol></section>';
  h+='<section class="sec"><h2>Backup</h2><p class="muted small" style="margin-bottom:8px">Copy this text somewhere safe. Paste it back here to restore.</p><textarea class="field" id="bk" aria-label="Backup text" spellcheck="false"></textarea><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn" data-a="bkcopy">Copy backup</button><button class="btn" data-a="bkload">Restore from text</button></div></section>';
  h+='<section class="sec"><h2>Reset</h2><div id="rs"><button class="btn warn" data-a="rs1">Erase all progress</button></div></section>';
  return h;
}

/* ---- session views ---- */
function chipsHTML(){
  var s=SES,it=s.cur,card=CARD[it.id],cs=C(it.id),h='<div class="meta"><span class="tag">'+SECT[card.s]+' · '+LEVS[card.l]+'</span>';
  if(it.ph==='new')h+='<span class="tag new">New</span>';
  else if(it.ph==='retry')h+='<span class="tag retry">Again</span>';
  else if(it.ph==='second')h+='<span class="tag new">Quick check</span>';
  if(s.mode!=='exam'&&s.mode!=='sprint')h+=strength(cs.b);
  return h+'</div>';
}
function sessionHTML(){
  var s=SES,it=s.cur,card=CARD[it.id],h='';
  var pct=Math.round(s.done/(s.done+s.queue.length+(s.stage==='fb'?0:0))*100)||0;
  var combo='<span class="combo'+(s.combo>=5?' hot':'')+'">'+(s.mode==='sprint'?s.score+' pts':(s.combo>=2?'×'+s.combo:''))+'</span>';
  var prog=s.mode==='sprint'?'<div class="prog time"><i id="tbar" style="width:'+Math.max(0,(s.end-Date.now())/600)+'%"></i></div>':'<div class="prog"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="sbar"><button class="x" data-a="quit" aria-label="End session">'+I.x+'</button>'+prog+combo+'</div>';
  h+=chipsHTML();
  var shake=(s.stage==='fb'&&s.res==='bad')?' shake':'';
  h+='<div class="qcard'+shake+'"><div class="qt">'+esc(card.q)+'</div>';
  if(s.mode==='exam')h+='<div class="nb">Question '+(s.done+1)+' of '+(s.done+s.queue.length)+'</div>';
  h+='</div>';
  if(s.stage==='think'){
    h+='<div class="think"><b>Answer in your head</b>Say it out loud if you can. Then check.</div>';
    h+='<div class="dock"><div><button class="btn pri block" data-a="show">Show choices</button></div></div>';
    return h;
  }
  h+='<div class="opts" role="group" aria-label="Choices">';
  var fb=s.stage==='fb';
  s.order.forEach(function(oi,i){
    var cls='opt',dis='';
    if(fb){
      dis=' disabled';
      var right=(oi===card.a),chosen=(s.chosen===i);
      if(right){cls+=' ok';if(!s.locked){cls+=' pulse';dis=''}}
      else if(chosen){cls+=' no'}
      else cls+=' dim';
    }
    h+='<button class="'+cls+'" data-a="'+(fb?'lock':'ans')+'" data-i="'+i+'"'+dis+'><span class="k">'+'ABCD'[i]+'</span><span>'+esc(card.o[oi])+'</span></button>';
  });
  h+='</div>';
  if(!fb){
    h+='<button class="idk" data-a="idk">'+(s.mode==='exam'?'Skip':'I don’t know yet')+'</button>';
    return h;
  }
  if(s.mode==='sprint')return h;
  var ban=s.res==='good'?'<div class="banner ok">'+I.ok+'Correct</div>':(s.res==='idk'?'<div class="banner sk">Now you know it</div>':'<div class="banner no">'+I.no+'Not quite</div>');
  h+=ban;
  if(!s.locked)h+='<p class="muted" style="margin:4px 0 0">Tap the right answer to lock it in.</p>';
  h+='<div class="hook"><div class="eyebrow">Memory hook</div>'+esc(card.h)+'</div>';
  if(card.f)h+='<div class="note amber small" style="margin-top:10px"><b>May change.</b> '+esc(card.f)+'</div>';
  var c=C(it.id);
  if(s.locked){
    var cap=(s.res==='good')?(it.ph==='retry'||it.ph==='second'?'Good. One more pass later.':'Next review '+inDays(c.d)+'.'):'This one comes back in a few cards.';
    h+='<p class="next">'+cap+'</p>';
  }
  h+='<div class="dock"><div><button class="btn pri block" data-a="next"'+(s.locked?'':' disabled')+'>Continue</button></div></div>';
  return h;
}
function afterSession(){
  var s=SES;if(!s)return;
  if(s.stage==='done'){window.scrollTo(0,0);countUp();return}
  var bn=document.querySelector('.banner');
  if(s.stage==='fb'&&bn&&s.mode!=='sprint'){try{bn.scrollIntoView({block:'center'})}catch(x){}}
  else window.scrollTo(0,0);
  var b=document.querySelector('[data-a="next"]');if(b&&!b.disabled)b.focus({preventScroll:true});
}
function summaryHTML(){
  var s=SES,g=Math.round(s.alt1-s.alt0),h='';
  var acc=s.done?Math.round(s.ok/s.done*100):0;
  h+='<header class="top"><h1>'+(s.mode==='exam'?'Mock exam':s.mode==='sprint'?'Sprint 60':'Session done')+'</h1></header>';
  if(s.mode==='exam'){
    var gd=s.exam.filter(function(e){return e.res==='good'}).length,tt=s.exam.length;
    h+='<div class="sum">'+contours()+'<div class="eyebrow">Score</div><div class="gain" style="color:var(--ink)">'+Math.round(gd/tt*100)+'<span style="font-size:.4em">%</span></div><div class="sub">'+gd+' of '+tt+' correct</div></div>';
    var bys=[0,0,0,0],byn=[0,0,0,0];s.exam.forEach(function(e){var x=CARD[e.id].s;byn[x]++;if(e.res==='good')bys[x]++});
    h+='<section class="sec"><h2>By subject</h2><div class="bars">'+SECT.map(function(n,i){var p=byn[i]?Math.round(bys[i]/byn[i]*100):0;return '<div><span>'+n+'</span><span class="bg"><i style="width:'+p+'%"></i></span><em>'+(byn[i]?p+'%':'–')+'</em></div>'}).join('')+'</div></section>';
  }else if(s.mode==='sprint'){
    h+='<div class="sum">'+contours()+'<div class="eyebrow">Points</div><div class="gain">'+s.score+'</div><div class="sub">Best '+S.sp+(s.score>=S.sp&&s.score>0?' · new record':'')+'</div></div>';
  }else{
    h+='<div class="sum">'+contours()+'<div class="eyebrow">Altitude gained</div><div class="gain" style="color:'+(g<0?'var(--red)':'var(--accent)')+'"><span id="gainv" data-to="'+g+'">'+(g>0?'+':'')+'0</span><span style="font-size:.35em;color:var(--muted)"> m</span></div><div class="sub">'+fm(s.alt0)+' m → '+fm(s.alt1)+' m</div>'+profile(s.alt1)+'</div>';
  }
  h+='<div class="grid3"><div><b>'+acc+'%</b><span>correct</span></div><div><b>'+s.newSeen+'</b><span>new cards</span></div><div><b>+'+s.xp+'</b><span>points</span></div></div>';
  if(s.mode!=='sprint'){
    var seen={},w=[];s.wrong.forEach(function(id){if(!seen[id]){seen[id]=1;w.push(id)}});
    if(w.length){h+='<section class="sec"><h2>To look at again ('+w.length+')</h2><div class="miss">'+w.map(function(id){var c=CARD[id];return '<div><b>'+esc(c.q)+'</b><span>'+esc(c.o[c.a])+'</span></div>'}).join('')+'</div></section>'}
  }
  h+='<div class="dock"><div style="display:grid;gap:8px"><button class="btn pri block" data-a="done">Back to base</button></div></div>';
  return h;
}
function countUp(){
  var el=$('#gainv');if(!el)return;
  var to=+el.getAttribute('data-to'),t0=performance.now(),dur=900;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=(to>0?'+':'')+to;return}
  (function f(now){var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3),v=Math.round(to*e);el.textContent=(to>0?'+':'')+v;if(p<1&&document.body.contains(el))requestAnimationFrame(f)})(t0);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a');
  switch(a){
    case 'tab':view=el.getAttribute('data-v');render();break;
    case 'intro':S.intro=1;save();render();break;
    case 'daily':startSession('daily',{extra:(Math.min(dueList().length,40)+Math.max(0,S.set.np-newToday())===0&&unseenList().length>0)});
      if(!SES&&dueList().length===0&&unseenList().length===0){startSession('terr',{k:weakestTerr()})}break;
    case 'mistakes':startSession('mistakes');break;
    case 'sprint':startSession('sprint');break;
    case 'exam':startSession('exam');break;
    case 'terr':startSession('terr',{k:+el.getAttribute('data-k')});break;
    case 'flagged':view='cards';filt='doubt';query='';render();break;
    case 'filt':filt=el.getAttribute('data-f');document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.getAttribute('data-f')===filt))});renderList();break;
    case 'ans':answer(+el.getAttribute('data-i'));break;
    case 'idk':answer(-1);break;
    case 'show':if(SES&&SES.stage==='think'){SES.stage='ask';render()}break;
    case 'lock':lockIn();break;
    case 'next':cont();break;
    case 'quit':quit();break;
    case 'done':done();break;
    case 'bkcopy':
      var ta=$('#bk');ta.value=JSON.stringify(S);ta.select();
      try{navigator.clipboard.writeText(ta.value).then(function(){toast('Backup copied')}).catch(function(){toast('Select the text and copy it')})}catch(x){toast('Select the text and copy it')}
      break;
    case 'bkload':
      try{var o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.c||!o.set)throw 0;S=norm(o);save();toast('Progress restored');render()}catch(x){toast('That text is not a valid backup')}
      break;
    case 'rs1':$('#rs').innerHTML='<p style="margin-bottom:8px">This erases every card, streak and badge.</p><div style="display:flex;gap:8px"><button class="btn warn" data-a="rs2">Yes, erase</button><button class="btn" data-a="rs3">Cancel</button></div>';break;
    case 'rs2':S=fresh();save();toast('Progress erased');render();break;
    case 'rs3':render();break;
  }
});
function weakestTerr(){var w=0,m=2;for(var k=0;k<12;k++){var t=terrStats(k);if(t.avg<m){m=t.avg;w=k}}return w}
document.addEventListener('input',function(e){
  if(e.target.id==='search'){query=e.target.value;renderList()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='s-exam'){if(fromIso(e.target.value)!==null){S.set.exam=e.target.value;save();toast('Test date updated')}}
  else if(id==='s-np'){S.set.np=+e.target.value;save()}
  else if(id==='s-goal'){S.set.goal=+e.target.value;save()}
  else if(id==='s-think'){S.set.think=e.target.checked;save()}
});
document.addEventListener('keydown',function(e){
  if(!SES||e.metaKey||e.ctrlKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  var k=e.key.toLowerCase(),s=SES;
  if(s.stage==='ask'){
    var i='1234'.indexOf(k);if(i<0)i='abcd'.indexOf(k);
    if(i>=0){e.preventDefault();answer(i)}
  }else if(s.stage==='think'&&(k==='enter'||k===' ')){e.preventDefault();s.stage='ask';render()}
  else if(s.stage==='fb'){
    if(!s.locked){var j='1234'.indexOf(k);if(j<0)j='abcd'.indexOf(k);if(j>=0&&s.order[j]===CARD[s.cur.id].a){e.preventDefault();lockIn()}}
    else if(k==='enter'||k===' '){e.preventDefault();cont()}
  }
});

render();
initRemote();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
